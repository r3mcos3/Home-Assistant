blueprint:
  name: "\U0001F916 AI Weather Report Generator"
  description: "\U0001F4E6 [Version 1.1.0] Fetches weather forecasts at regular intervals,
    uses AI to create an emoji-rich summary, and stores it in a text helper. Perfect
    for dashboard displays or notifications! ☀️\U0001F327️⛈️\n"
  domain: automation
  author: r3mcos3
  homeassistant:
    min_version: 2025.12.0
  source_url: https://github.com/r3mcos3/blueprints/blob/main/ai_weather_report/ai_weather_report.yaml
  input:
    weather_entity:
      name: "\U0001F324️ Weather Entity"
      description: The weather integration entity to fetch forecasts from
      selector:
        entity:
          filter:
          - domain:
            - weather
          multiple: false
          reorder: false
    forecast_type:
      name: "\U0001F4CA Forecast Type"
      description: Type of weather forecast to retrieve
      default: hourly
      selector:
        select:
          options:
          - label: Hourly
            value: hourly
          - label: Daily
            value: daily
          multiple: false
          custom_value: false
          sort: false
    update_frequency:
      name: ⏰ Update Frequency
      description: How often to update the weather report
      default: /6
      selector:
        select:
          options:
          - label: Every hour
            value: /1
          - label: Every 2 hours
            value: /2
          - label: Every 3 hours
            value: /3
          - label: Every 6 hours
            value: /6
          - label: Every 12 hours
            value: /12
          - label: Once per day (06:00)
            value: '6'
          multiple: false
          custom_value: false
          sort: false
    ai_task_entity:
      name: "\U0001F9E0 AI Task Entity"
      description: The AI task integration entity to use for generating the summary
      selector:
        entity:
          filter:
          - domain:
            - ai_task
          multiple: false
          reorder: false
    report_length:
      name: "\U0001F4DD Report Length"
      description: Maximum length of the AI-generated report in characters (limited
        to 255 because input_text helpers have a maximum length of 255 characters)
      default: 150
      selector:
        number:
          min: 50.0
          max: 255.0
          step: 10.0
          unit_of_measurement: characters
          mode: box
    ai_language:
      name: "\U0001F30D Report Language"
      description: Language for the AI-generated weather report
      default: dutch
      selector:
        select:
          options:
          - label: Nederlands
            value: dutch
          - label: English
            value: english
          - label: Deutsch
            value: german
          - label: Français
            value: french
          - label: Español
            value: spanish
          multiple: false
          custom_value: false
          sort: false
    target_input_text:
      name: "\U0001F4C4 Target Input Text Helper"
      description: The input_text entity where the AI report will be stored
      selector:
        entity:
          filter:
          - domain:
            - input_text
          multiple: false
          reorder: false
mode: single
max_exceeded: silent
variables:
  weather_entity_id: !input weather_entity
  report_max_length: !input report_length
  selected_language: !input ai_language
  selected_forecast_type: !input forecast_type
  target_helper: !input target_input_text
triggers:
- trigger: time_pattern
  hours: !input update_frequency
conditions: []
actions:
- action: weather.get_forecasts
  target:
    entity_id: !input weather_entity
  data:
    type: !input forecast_type
  response_variable: hourly_forecast
- variables:
    forecast_list: '{% set entries = (hourly_forecast | default({}, true)).get(weather_entity_id,
      {}).get(''forecast'', []) %} {{ entries[:(24 if selected_forecast_type == ''hourly''
      else 7)] }}

      '
    language_instructions:
      dutch: 'Hier is het weer voor de aankomende uren in JSON: {{ forecast_list |
        tojson }}. Maak hier een weerbericht van in maximaal {{ report_max_length
        }} tekens. Gebruik veel emojis en geef alleen de tekst van het bericht terug.'
      english: 'Here is the weather for the upcoming hours in JSON: {{ forecast_list
        | tojson }}. Create a weather report of at most {{ report_max_length }} characters.
        Use many emojis and return only the text of the report.'
      german: 'Hier ist das Wetter für die kommenden Stunden in JSON: {{ forecast_list
        | tojson }}. Erstelle einen Wetterbericht mit höchstens {{ report_max_length
        }} Zeichen. Verwende viele Emojis und gib nur den Text des Berichts zurück.'
      french: 'Voici la météo pour les heures à venir en JSON: {{ forecast_list |
        tojson }}. Créez un rapport météo de {{ report_max_length }} caractères au
        maximum. Utilisez beaucoup d''emojis et ne renvoyez que le texte du rapport.'
      spanish: 'Aquí está el clima para las próximas horas en JSON: {{ forecast_list
        | tojson }}. Crea un informe meteorológico de como máximo {{ report_max_length
        }} caracteres. Usa muchos emojis y devuelve solo el texto del informe.'
    ai_instructions_text: '{{ language_instructions[selected_language] }}

      '
- condition: template
  value_template: '{{ forecast_list | length > 0 }}'
- action: ai_task.generate_data
  data:
    task_name: weather_forecast_summary
    entity_id: !input ai_task_entity
    instructions: '{{ ai_instructions_text }}'
  response_variable: ai_response
- condition: template
  value_template: '{{ ai_response is mapping and (ai_response.data | default('''',
    true) | string | trim) != '''' }}'
- variables:
    helper_max_length: '{{ state_attr(target_helper, ''max'') | int(255) }}'
- action: input_text.set_value
  target:
    entity_id: !input target_input_text
  data:
    value: '{{ (ai_response.data | string | trim)[:helper_max_length] }}'
