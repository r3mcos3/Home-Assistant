blueprint:
  domain: automation
  name: "\U0001F514 Doorbell Chime"
  author: r3mcos3
  source_url: https://github.com/r3mcos3/blueprints/blob/main/doorbell_chime/doorbell_chime.yaml
  homeassistant:
    min_version: 2025.12.0
  description: "\U0001F4E6 [Version 1.1.0] Play a chime sound on your media players
    when the doorbell rings! \U0001F514\n\nFeatures:\n- \U0001F50A Adjustable volume
    with optional restore\n- \U0001F319 Time-based conditions (quiet hours)\n- \U0001F6AB
    Do Not Disturb mode support\n- ⏱️ Built-in cooldown (single mode)\n"
  input:
    doorbell_sensor:
      name: "\U0001F514 Doorbell Sensor"
      description: '`Required`


        The binary sensor that detects when the doorbell is pressed.

        '
      selector:
        entity:
          filter:
          - domain:
            - binary_sensor
          multiple: false
          reorder: false
    media_players_target:
      name: "\U0001F50A Media Players"
      description: '`Required`


        Select the media players where the chime should be played.

        '
      selector:
        target:
          entity:
          - domain:
            - media_player
    media_file:
      name: "\U0001F3B5 Media File"
      description: '`Required`


        Select the chime sound file from your media library.

        '
      selector:
        media:
          accept:
          - audio/*
          multiple: false
          image_upload: false
    chime_volume:
      name: "\U0001F509 Chime Volume"
      description: '`Optional`


        Volume level for the chime (0.0 - 1.0).

        '
      default: 0.5
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    restore_volume:
      name: "\U0001F504 Restore Volume"
      description: '`Optional`


        Restore the original volume after the chime has played.

        '
      default: true
      selector:
        boolean: {}
    use_time_condition:
      name: "\U0001F319 Enable Time Condition"
      description: '`Optional`


        Only play the chime between specific hours (e.g., quiet hours at night).

        '
      default: false
      selector:
        boolean: {}
    time_start:
      name: ⏰ Start Time
      description: '`Conditional`


        Start time when the chime is allowed to play (requires time condition enabled).

        '
      default: 08:00:00
      selector:
        time: {}
    time_end:
      name: ⏰ End Time
      description: '`Conditional`


        End time when the chime is allowed to play (requires time condition enabled).

        '
      default: '22:00:00'
      selector:
        time: {}
    use_dnd:
      name: "\U0001F6AB Enable Do Not Disturb"
      description: '`Optional`


        Use a boolean helper to temporarily disable the chime.

        '
      default: false
      selector:
        boolean: {}
    dnd_helper:
      name: "\U0001F6AB Do Not Disturb Helper"
      description: '`Conditional`


        An input_boolean helper that silences the chime when turned on (requires DND
        enabled).

        '
      default: []
      selector:
        entity:
          filter:
          - domain:
            - input_boolean
          multiple: false
          reorder: false
    chime_max_seconds:
      name: ⏱️ Maximum Chime Length
      description: '`Optional`


        Volume is restored when the chime has finished playing, but never later than
        this many seconds after it started. Raise it for long chime files.

        '
      default: 10
      selector:
        number:
          min: 3.0
          max: 60.0
          unit_of_measurement: seconds
          mode: slider
          step: 1.0
mode: single
max_exceeded: silent
variables:
  use_time: !input use_time_condition
  use_dnd_mode: !input use_dnd
  dnd_entity: !input dnd_helper
  dnd_set: '{{ dnd_entity is string and dnd_entity | length > 0 }}'
  max_chime_seconds: !input chime_max_seconds
  restore: !input restore_volume
  target_players: !input media_players_target
  volume: !input chime_volume
triggers:
- trigger: state
  entity_id: !input doorbell_sensor
  from: 'off'
  to: 'on'
conditions:
- condition: or
  conditions:
  - '{{ not use_time }}'
  - condition: time
    after: !input time_start
    before: !input time_end
- condition: or
  conditions:
  - '{{ not use_dnd_mode }}'
  - '{{ not dnd_set }}'
  - condition: template
    value_template: '{{ states(dnd_entity) == ''off'' }}'
actions:
- variables:
    player_entities: "{% set t = target_players %} {% set ns = namespace(entities=[])
      %} {% if t.entity_id is defined and t.entity_id %}\n  {% set ns.entities = ns.entities
      + ([t.entity_id] if t.entity_id is string else t.entity_id) %}\n{% endif %}
      {% if t.device_id is defined and t.device_id %}\n  {% for device in ([t.device_id]
      if t.device_id is string else t.device_id) %}\n    {% set ns.entities = ns.entities
      + (device_entities(device) | select('match', 'media_player\\\\.') | list) %}\n
      \ {% endfor %}\n{% endif %} {% if t.area_id is defined and t.area_id %}\n  {%
      for area in ([t.area_id] if t.area_id is string else t.area_id) %}\n    {% set
      ns.entities = ns.entities + (area_entities(area) | select('match', 'media_player\\\\.')
      | list) %}\n  {% endfor %}\n{% endif %} {{ ns.entities | unique | list }}\n"
- variables:
    original_volumes: "{% set ns = namespace(volumes={}) %} {% for entity in player_entities
      %}\n  {% if state_attr(entity, 'volume_level') is number %}\n    {% set ns.volumes
      = dict(ns.volumes, **{entity: state_attr(entity, 'volume_level')}) %}\n  {%
      endif %}\n{% endfor %} {{ ns.volumes }}\n"
- action: media_player.volume_set
  continue_on_error: true
  target: !input media_players_target
  data:
    volume_level: !input chime_volume
- action: media_player.play_media
  continue_on_error: true
  target: !input media_players_target
  data: !input media_file
- delay:
    seconds: 3
- wait_template: '{{ expand(player_entities) | selectattr(''state'', ''eq'', ''playing'')
    | list | count == 0 }}'
  timeout:
    seconds: '{{ max_chime_seconds }}'
  continue_on_timeout: true
- if:
  - condition: template
    value_template: '{{ restore }}'
  then:
  - repeat:
      for_each: '{{ player_entities }}'
      sequence:
      - if:
        - condition: template
          value_template: '{{ repeat.item in original_volumes }}'
        then:
        - action: media_player.volume_set
          continue_on_error: true
          target:
            entity_id: '{{ repeat.item }}'
          data:
            volume_level: '{{ original_volumes[repeat.item] }}'
