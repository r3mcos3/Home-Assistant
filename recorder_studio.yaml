# Managed by Recorder Studio. Manual edits will be overwritten.
# Include from configuration.yaml with:  recorder: !include recorder_studio.yaml

auto_purge: true
auto_repack: true
purge_keep_days: 14
commit_interval: 5
db_url: !secret recorder_studio_db_url

